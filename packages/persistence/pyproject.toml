[project]
name = "voice-agent-studio-persistence"
version = "0.1.0"
description = "Shared SQLAlchemy schema for Voice Agent Studio services"
authors = [{ name = "skan0779" }]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.43",
]

[project.urls]
Homepage = "https://github.com/skan0779/voice-agent-studio"
Repository = "https://github.com/skan0779/voice-agent-studio"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent_persistence"]
